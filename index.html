<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Can Clicker">
<meta name="description" content="CAN CLICKER - an idle clicker about energy drink cans. Offline-ready PWA.">
<title>CAN CLICKER</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* ============================== THEME ============================== */
:root{
  --acc:#7cff00; --acc-rgb:124,255,0;
  --bg:#050505; --panel:#0f0f13; --panel2:#17171d; --line:#26262e;
  --txt:#f3f3f5; --dim:#8b8b99; --bad:#ff4d5e; --good:#35e08a;
  --disp:'Bebas Neue',Impact,'Arial Narrow',sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r-common:#8b929a; --r-rare:#3da5ff; --r-epic:#b44dff; --r-legendary:#ffb300; --r-limited:#ff3d7f;
}
body.hallo{ --bg:#0b0412; --panel:#150a20; --panel2:#1f1030; --line:#3a1f55; --acc:#ff7a00; --acc-rgb:255,122,0; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--body);
  overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;touch-action:manipulation;}
button{font-family:inherit;color:inherit;-webkit-appearance:none;appearance:none;cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0;margin:0 auto;max-width:560px;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
#bg{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 50% 42%,rgba(var(--acc-rgb),.20),transparent 62%),
             radial-gradient(circle at 50% 120%,rgba(var(--acc-rgb),.10),transparent 50%);transition:background .6s}
body.over #bg{animation:neon .45s infinite alternate}
body.over #app{box-shadow:inset 0 0 60px rgba(var(--acc-rgb),.55)}
body.crash #bg{filter:grayscale(1) brightness(.6)}
@keyframes neon{from{opacity:.55}to{opacity:1;filter:brightness(1.6)}}
.shake{animation:shake .28s}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,-3px)}80%{transform:translate(3px,4px)}}

/* ============================== HUD ============================== */
#hud{position:relative;z-index:3;padding:calc(env(safe-area-inset-top) + 8px) 16px 6px;text-align:center}
#cans{font:400 52px/1 var(--disp);letter-spacing:1px;color:#fff;text-shadow:0 0 18px rgba(var(--acc-rgb),.55)}
.hud-lbl{font:400 15px var(--disp);letter-spacing:3px;color:var(--acc);margin-top:-2px}
.hud-sub{display:flex;justify-content:center;gap:16px;font-size:13px;color:var(--dim);margin-top:4px}
.hud-sub b{color:var(--txt);font-weight:800}
#banners{position:relative;z-index:3;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:0 12px;min-height:0}
.chip{font:800 11px var(--body);letter-spacing:.5px;padding:5px 9px;border-radius:99px;background:rgba(var(--acc-rgb),.15);border:1px solid rgba(var(--acc-rgb),.5);color:var(--acc)}
.chip.pink{background:rgba(255,61,127,.15);border-color:#ff3d7f;color:#ff7aa6}
.chip.red{background:rgba(255,77,94,.15);border-color:var(--bad);color:#ff8d99}

/* ============================== VIEWS ============================== */
#views{position:relative;z-index:2;flex:1;min-height:0}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.active{display:flex}
.sc{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:8px 12px 16px}
.sec-h{font:400 22px var(--disp);letter-spacing:1.5px;margin:10px 2px 8px;color:var(--txt);display:flex;justify-content:space-between;align-items:baseline}
.sec-h small{font:600 12px var(--body);color:var(--dim);letter-spacing:0}
#tabs{position:relative;z-index:4;display:flex;background:rgba(10,10,14,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;min-height:58px;background:none;border:0;color:var(--dim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:400 15px var(--disp);letter-spacing:1.5px;position:relative}
#tabs button .ti{font-size:20px;line-height:1;filter:grayscale(1) brightness(.8)}
#tabs button.on{color:var(--acc)}
#tabs button.on .ti{filter:none}
#tabs button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 4px 4px;background:var(--acc);box-shadow:0 0 12px var(--acc)}
.dot{position:absolute;top:8px;right:calc(50% - 22px);width:9px;height:9px;border-radius:50%;background:var(--bad);display:none}
.dot.on{display:block}

/* ============================== TAP VIEW ============================== */
.tap-top{display:flex;justify-content:center;gap:8px;padding:6px 12px;min-height:46px;align-items:center}
.eqchip{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px 10px 4px 6px;font-size:11px;min-height:36px;max-width:48%}
.eqchip svg{width:20px;height:32px;flex:none}
.eqchip b{display:block;font:400 14px var(--disp);letter-spacing:1px}
.eqchip span{color:var(--dim);display:block;line-height:1.15}
#can-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#can{width:min(68vw,330px);height:min(46vh,calc(min(68vw,330px)*1.6));touch-action:none;cursor:pointer;filter:drop-shadow(0 0 28px rgba(var(--acc-rgb),.45));will-change:transform}
#can svg{width:100%;height:100%;display:block;pointer-events:none}
body.over #can{filter:drop-shadow(0 0 45px var(--acc)) saturate(1.5)}
.meter{padding:6px 18px 10px;position:relative;z-index:2}
.mrow{display:flex;justify-content:space-between;font:400 16px var(--disp);letter-spacing:1.5px;margin-bottom:4px}
#combo-t{color:var(--acc)}
#caff-lbl{color:var(--dim)}
#caff-lbl.hot{color:#ffd400}
#caff-lbl.over{color:#fff;text-shadow:0 0 10px var(--acc)}
#caff-lbl.crash{color:var(--bad)}
.bar{height:16px;border-radius:99px;background:#15151b;border:1px solid var(--line);overflow:hidden;position:relative}
.bar>i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#ffd400,var(--acc));border-radius:99px;transition:width .08s linear}
.bar.over>i{background:linear-gradient(90deg,#fff,var(--acc));box-shadow:0 0 14px var(--acc)}
.bar.crash>i{background:var(--bad)}
.bar::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:rgba(255,255,255,.3)}
.bar.thin{height:10px}
.bar.thin::after{display:none}
.bar.prog>i{background:var(--acc);transition:width .3s}
#gold{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.gcan{position:absolute;left:0;top:0;width:68px;height:96px;margin:-48px 0 0 -34px;pointer-events:auto;touch-action:manipulation;filter:drop-shadow(0 0 14px #ffd400);cursor:pointer}
.gcan svg{width:100%;height:100%;display:block;pointer-events:none}
.gcan.ltd{filter:drop-shadow(0 0 14px #ff3d7f)}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}

/* ============================== CARDS / BUTTONS ============================== */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px;position:relative}
.card.locked{opacity:.45}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.btn{min-height:44px;border:0;border-radius:12px;background:var(--acc);color:#000;font:800 14px var(--body);padding:0 16px;letter-spacing:.3px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn:active{transform:scale(.97)}
.btn.alt{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
.btn.red{background:var(--bad);color:#fff}
.btn[disabled]{opacity:.3;pointer-events:none}
.btn.block{display:flex;width:100%}
.btn small{display:block;font-weight:600;font-size:10px;opacity:.8}
.nm{font:400 20px var(--disp);letter-spacing:1px}
.ds{font-size:12px;color:var(--dim);line-height:1.35}
.sm{font-size:12px;color:var(--dim)}
.hl{color:var(--acc)}
.bld .ico{font-size:30px;width:44px;text-align:center}
.bld .own{font:400 26px var(--disp);color:var(--acc);margin-left:auto}
.bld .btns{display:flex;gap:6px;margin-top:8px}
.bld .btns .btn{flex:1;min-height:44px;padding:0 4px;flex-direction:column;gap:0;font-size:13px;line-height:1.15}
.bld .btns .btn small{font-size:10px}
.tag{display:inline-block;font:800 10px var(--body);letter-spacing:.6px;padding:2px 7px;border-radius:99px;border:1px solid currentColor;vertical-align:middle}
.empty{text-align:center;color:var(--dim);padding:30px 20px;font-size:13px}
.upg .cost{font:400 20px var(--disp);color:var(--acc);letter-spacing:1px}

/* ============================== FRIDGE ============================== */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:8px 4px 6px;text-align:center;position:relative;min-height:44px}
.cell svg{width:54%;height:auto;display:block;margin:0 auto}
.cell .cn{font:400 14px var(--disp);letter-spacing:.6px;margin-top:2px;line-height:1.05;min-height:2.1em;display:flex;align-items:center;justify-content:center}
.cell .lv{position:absolute;top:4px;right:6px;font:800 10px var(--body);color:var(--dim)}
.cell .eq{position:absolute;top:4px;left:6px;font-size:12px}
.cell.u{opacity:.9}
.cell.u svg{opacity:.55}
.r-common{border-color:var(--r-common)} .r-rare{border-color:var(--r-rare);box-shadow:0 0 10px rgba(61,165,255,.2)}
.r-epic{border-color:var(--r-epic);box-shadow:0 0 12px rgba(180,77,255,.3)}
.r-legendary{border-color:var(--r-legendary);box-shadow:0 0 14px rgba(255,179,0,.4)}
.r-limited{border-color:var(--r-limited);animation:ltd 1.6s infinite alternate}
@keyframes ltd{from{box-shadow:0 0 6px rgba(255,61,127,.3)}to{box-shadow:0 0 18px rgba(255,61,127,.8)}}
.c-common{color:var(--r-common)} .c-rare{color:var(--r-rare)} .c-epic{color:var(--r-epic)} .c-legendary{color:var(--r-legendary)} .c-limited{color:var(--r-limited)}
.slots{display:flex;gap:8px;margin:6px 0 4px}
.slot{flex:1;height:78px;border:2px dashed var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--panel);position:relative;color:var(--dim);font-size:11px;text-align:center;padding:2px}
.slot svg{height:68px;width:auto}
.slot.lock{opacity:.4}
.crates{display:flex;gap:8px;margin:8px 0}
.crate{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 4px;text-align:center;min-height:76px}
.crate .ci{font-size:28px;line-height:1.1}
.crate .cc{font:400 18px var(--disp);letter-spacing:1px}
.crate.has{border-color:var(--acc);box-shadow:0 0 14px rgba(var(--acc-rgb),.3)}

/* ============================== MORE / MENU ============================== */
.menu{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 12px;text-align:left;min-height:84px;position:relative}
.mi .mt{font:400 22px var(--disp);letter-spacing:1px;display:block}
.mi .ms{font-size:11px;color:var(--dim);display:block;margin-top:2px}
.mi .mic{position:absolute;right:10px;top:8px;font-size:22px}
.back{margin:4px 0 8px}
.ach{display:flex;gap:10px;align-items:center}
.ach .ai{font-size:26px;width:40px;height:40px;border-radius:12px;background:var(--panel2);display:flex;align-items:center;justify-content:center;filter:grayscale(1);opacity:.5}
.ach.got .ai{filter:none;opacity:1;background:rgba(var(--acc-rgb),.18)}
.ach.got{border-color:rgba(var(--acc-rgb),.5)}
.stat{display:flex;justify-content:space-between;padding:11px 4px;border-bottom:1px solid var(--line);font-size:14px}
.stat b{font-weight:800;color:var(--acc)}
.tog{display:flex;justify-content:space-between;align-items:center;padding:6px 2px;min-height:48px}
.seg{display:flex;gap:4px}
.seg button{min-height:44px;min-width:48px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--dim);font:700 12px var(--body)}
.seg button.on{background:var(--acc);color:#000;border-color:var(--acc)}
.tabs2{display:flex;gap:6px;margin:6px 0 10px}
.tabs2 button{flex:1;min-height:44px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font:400 17px var(--disp);letter-spacing:1px;color:var(--dim)}
.tabs2 button.on{background:var(--acc);color:#000;border-color:var(--acc)}
textarea{width:100%;min-height:110px;background:#000;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px;font:11px monospace;-webkit-user-select:text;user-select:text}

/* ============================== MODAL / TOAST ============================== */
#modal{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
#modal[hidden]{display:none}
.mbox{width:100%;max-height:100%;overflow-y:auto;background:var(--panel);border:1px solid var(--acc);border-radius:20px;padding:18px;text-align:center;box-shadow:0 0 40px rgba(var(--acc-rgb),.25);overscroll-behavior:contain;animation:pop .25s}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.mbox h2{font:400 32px var(--disp);letter-spacing:2px;margin:0 0 4px;color:var(--acc)}
.mbox p{margin:6px 0;color:var(--dim);font-size:13px;line-height:1.45}
.mbox .big{font:400 44px var(--disp);color:#fff;letter-spacing:1px}
.mbox .cb{display:flex;gap:8px;margin-top:14px}
.mbox .cb .btn{flex:1}
.mbox svg.big-can{height:200px;width:auto;margin:6px auto;display:block;filter:drop-shadow(0 0 18px rgba(var(--acc-rgb),.5))}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:12px 0}
.day{border:1px solid var(--line);border-radius:10px;padding:6px 0;font-size:10px;color:var(--dim);background:var(--panel2)}
.day b{display:block;font-size:18px;font-weight:400}
.day.cur{border-color:var(--acc);color:var(--acc);background:rgba(var(--acc-rgb),.12)}
.day.done{opacity:.4}
.crate-anim{font-size:90px;animation:cshake .5s infinite}
@keyframes cshake{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg) scale(1.05)}75%{transform:rotate(12deg) scale(1.05)}}
.reveal{animation:reveal .6s}
@keyframes reveal{from{transform:scale(.2) rotate(-20deg);opacity:0;filter:brightness(4)}to{transform:none;opacity:1;filter:none}}
#toasts{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 142px);z-index:30;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 12px}
.toast{background:rgba(15,15,19,.96);border:1px solid var(--acc);border-radius:14px;padding:9px 14px;font-size:13px;font-weight:600;max-width:100%;box-shadow:0 4px 24px rgba(0,0,0,.6);animation:tin .3s,tout .4s 2.8s forwards}
.toast b{color:var(--acc)}
@keyframes tin{from{transform:translateY(-20px);opacity:0}to{transform:none;opacity:1}}
@keyframes tout{to{opacity:0;transform:translateY(-10px)}}

/* ============================== MINI-GAMES ============================== */
.mg{background:#000;border-radius:14px;border:1px solid var(--line);display:block;margin:8px auto;touch-action:none}
.pressure{height:30px}
.mcard{aspect-ratio:1;border-radius:12px;background:var(--panel2);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;padding:4px;transition:transform .2s}
.mcard svg{height:100%;width:auto}
.mcard.back{background:repeating-linear-gradient(45deg,#16161c,#16161c 6px,#1d1d25 6px,#1d1d25 12px)}
.mcard.ok{border-color:var(--acc);opacity:.6}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
</style>
</head>
<body>
<div id="app">
  <div id="bg"></div>
  <div id="hud">
    <div id="cans">0</div>
    <div class="hud-lbl" data-b="currency">CANS</div>
    <div class="hud-sub"><span>⚡ <b id="cps">0</b>/s</span><span>👆 <b id="cpt">1</b>/tap</span></div>
  </div>
  <div id="banners"></div>
  <main id="views">
    <section id="v-tap" class="view active">
      <div class="tap-top" id="eqchips"></div>
      <div id="can-wrap"><div id="can" role="button" aria-label="Tap the can"></div></div>
      <div class="meter">
        <div class="mrow"><span id="combo-t">COMBO x0</span><span id="caff-lbl">CAFFEINE</span></div>
        <div class="bar" id="caff-bar"><i id="caff-fill"></i></div>
      </div>
    </section>
    <section id="v-bld" class="view"><div class="sc" id="bld-list"></div></section>
    <section id="v-upg" class="view"><div class="sc" id="upg-list"></div></section>
    <section id="v-fri" class="view"><div class="sc" id="fri-body"></div></section>
    <section id="v-more" class="view"><div class="sc" id="more-body"></div></section>
  </main>
  <nav id="tabs">
    <button data-tab="tap" class="on"><span class="ti">🥤</span><span data-b="tab_tap">TAP</span></button>
    <button data-tab="bld"><span class="ti">🏭</span><span data-b="tab_bld">BUILD</span></button>
    <button data-tab="upg"><span class="ti">⚡</span><span data-b="tab_upg">UPGRADES</span><i class="dot" id="dot-upg"></i></button>
    <button data-tab="fri"><span class="ti">🧊</span><span data-b="tab_fri">FRIDGE</span><i class="dot" id="dot-fri"></i></button>
    <button data-tab="more"><span class="ti">☰</span><span data-b="tab_more">MORE</span><i class="dot" id="dot-more"></i></button>
  </nav>
  <canvas id="fx"></canvas>
  <div id="gold"></div>
  <div id="toasts"></div>
  <div id="modal" hidden></div>
</div>
<script>
'use strict';
/* =====================================================================
   CAN CLICKER  -  single-file idle clicker PWA
   Sections: CONFIG · UTIL · STATE · DERIVED · GAME LOGIC · AUDIO · FX ·
             UI · EVENTS · MINIGAMES · SAVE · BOOT / GAME LOOP
   ===================================================================== */

/* =====================================================================
   1. CONFIG  -  every brand / flavour / building name lives in here.
   Re-skin the whole game to an original brand by editing CFG only.
   ===================================================================== */
const CFG = {
  brand: {
    name: 'CAN CLICKER', currency: 'Cans', currencyOne: 'Can', fridge: 'Fridge',
    crate: 'Crate', token: 'Aluminium Token', tokens: 'Aluminium Tokens', tokenShort: 'Tokens',
    recycle: 'Recycle', plant: 'Recycling Plant', caffeine: 'Caffeine', golden: 'Golden Can',
    overcharge: 'OVERCHARGED', crash: 'Sugar Crash', tagline: 'Tap. Fizz. Repeat.',
    tabs: { tap: 'TAP', bld: 'BUILD', upg: 'UPGRADES', fri: 'FRIDGE', more: 'MORE' },
    saveKey: 'canclicker.save', hallo: 'Halloween Event'
  },
  rarities: {
    common:    { name: 'Common',    color: '#8b929a' },
    rare:      { name: 'Rare',      color: '#3da5ff' },
    epic:      { name: 'Epic',      color: '#b44dff' },
    legendary: { name: 'Legendary', color: '#ffb300' },
    limited:   { name: 'Limited',   color: '#ff3d7f' }
  },
  /* Crate tables: relative weight per rarity. Limited weights are small on purpose. */
  crates: {
    common: { name: 'Common Crate', icon: '📦', w: { common: 70, rare: 24, epic: 5, legendary: 0.6, limited: 1 } },
    rare:   { name: 'Rare Crate',   icon: '🎁', w: { common: 25, rare: 50, epic: 18, legendary: 3,   limited: 4 } },
    epic:   { name: 'Epic Crate',   icon: '💎', w: { common: 0,  rare: 35, epic: 48, legendary: 10,  limited: 7 } }
  },
  /* Perk definitions: u = unit ('%' ×100, 's' secs, 'h' hours, 'x' plain), t = text after the number */
  perks: {
    tapMult:    { u: '%', t: 'tap power' },
    costRed:    { u: '%', t: 'cheaper buildings' },
    offlineEff: { u: '%', t: 'offline earnings' },
    goldenFreq: { u: '%', t: 'more Golden Cans' },
    critDmg:    { u: 'x', t: 'crit damage' },
    caffGain:   { u: '%', t: 'faster caffeine fill' },
    crateLuck:  { u: '%', t: 'crate luck' },
    cpsTap:     { u: '%', t: 'of CPS added to taps' },
    critChance: { u: '%', t: 'crit chance' },

const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const rnd = (a, b) => a + Math.random() * (b - a);

const SUF = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
function fmt(n) {
  if (!isFinite(n)) return '∞';
  if (n < 0) return '-' + fmt(-n);
  const mode = (typeof S !== 'undefined' && S.set) ? S.set.numFmt : 'short';
  if (n < 1000) return n < 100 && n % 1 !== 0 ? String(Math.round(n * 10) / 10) : String(Math.floor(n));
  if (mode === 'full' && n < 1e15) return Math.floor(n).toLocaleString('en-US');
  if (mode === 'sci' || n >= 1e36) { const e = Math.floor(Math.log10(n)); return (n / Math.pow(10, e)).toFixed(2) + 'e' + e; }
  let i = Math.floor(Math.log10(n) / 3), v = n / Math.pow(1000, i);
  let s = v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : v.toFixed(0);
  if (parseFloat(s) >= 1000) { i++; s = (v / 1000).toFixed(2); }
  return s + SUF[i];
}
function fmtTime(sec) {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? `${h}h ${m}m` : m ? `${m}m ${s}s` : `${s}s`;
}
const dayKey = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
function shade(hex, amt) {            // darken (<0) / lighten (>0)
  const n = parseInt(hex.slice(1), 16);
  const f = c => Math.round(clamp(amt < 0 ? c * (1 + amt) : c + (255 - c) * amt, 0, 255));
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(f).map(x => x.toString(16).padStart(2, '0')).join('');
}
function hexRgb(hex) { const n = parseInt(hex.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function wpick(entries) {             // entries: [[value, weight], ...]
  let t = 0; entries.forEach(e => t += e[1]);
  let r = Math.random() * t;
  for (const e of entries) { r -= e[1]; if (r <= 0) return e[0]; }
  return entries[entries.length - 1][0];
}
/* Halloween: auto between Oct 15 and Nov 2 (local time), or forced on/off in settings */
function isHalloween() {
  const m = S.set.hallo; if (m === 'on') return true; if (m === 'off') return false;
  const d = new Date(), md = d.getMonth() * 100 + d.getDate();   // Oct 15 = 915, Nov 2 = 1002
  return md >= 915 && md <= 1002;
}

/* =====================================================================
   4. DERIVED  -  every multiplier is recomputed by recalc() when state changes
   ===================================================================== */
const D = {};
const MS = CFG.milestones;
function treeLv(id) { return S.pres.tree[id] || 0; }
function slotsMax() { return Math.min(5, 1 + (S.life >= 1e7 ? 1 : 0) + (S.pres.n >= 1 ? 1 : 0) + treeLv('slot')); }
function flavLv(id) { return S.fl[id] ? S.fl[id].lv : 0; }
function perkVal(f, lv) { return f.perk[1] * (1 + 0.2 * (lv - 1)) * (1 + 0.05 * treeLv('flvLv')); }
function perkSum(type) {
  let t = 0;
  for (const id of S.eq) { const f = FL[id]; if (f && f.perk[0] === type && S.fl[id]) t += perkVal(f, S.fl[id].lv); }
  return t;
}
function perkText(type, v) {
  const p = CFG.perks[type];
  const r = x => Math.round(x * 10) / 10;
  const n = p.u === '%' ? '+' + r(v * 100) + '%' : p.u === 'x' ? '+' + Math.round(v * 100) / 100 + 'x' : p.u === 's' ? '+' + r(v) + 's' : '+' + r(v) + 'h';
  return n + ' ' + p.t;
}
function chainSum(chain) { let t = 0; CFG.upgrades[chain].list.forEach((u, i) => { if (S.up[chain + i]) t += u[2]; }); return t; }
function chainProd(chain) { let t = 1; CFG.upgrades[chain].list.forEach((u, i) => { if (S.up[chain + i]) t *= u[2]; }); return t; }
function achCount() { return Object.keys(S.ach).length; }
function recalc() {
  const pk = perkSum;
  D.tapPow = chainProd('tapMult') * (1 + pk('tapMult')) * (1 + 0.25 * treeLv('tapPow'));
  D.cpsTap = chainSum('cpsTap') + pk('cpsTap') + 0.005 * treeLv('tapCps');
  D.critCh = 0.02 + chainSum('critC') + pk('critChance') + 0.01 * treeLv('critC');
  D.critMul = 5 + chainSum('critD') + pk('critDmg') + 0.5 * treeLv('critD');
  D.bld = (1 + chainSum('bld')) * (1 + pk('buildMult')) * (1 + 0.08 * treeLv('bldM'));
  D.tokenMul = 1 + 0.02 * S.pres.earned;
  D.global = (1 + 0.01 * achCount()) * D.tokenMul * (1 + pk('globalMult')) * (1 + chainSum('global')) * (1 + 0.10 * treeLv('prod'));
  D.costMul = (1 - Math.min(0.6, pk('costRed') + 0.01 * treeLv('cost'))) * (S.buffs.happy > 0 ? 0.8 : 1);
  D.offCap = 8 + chainSum('offline') + pk('offlineCap') + 4 * treeLv('offCap');
  D.offEff = Math.min(1, 0.5 + pk('offlineEff') + 0.1 * treeLv('offEff'));
  D.comboT = 1.5 + pk('comboLen');
  D.drain = Math.max(0.25, 1 - pk('caffDrain'));
  D.caffG = 1 + pk('caffGain') + 0.08 * treeLv('caffG');
  D.luck = 1 + chainSum('crate') + pk('crateLuck') + 0.08 * treeLv('cLuck');
  D.drop = 1 + pk('dropRate') + 0.15 * treeLv('drop');
  D.gFreq = 1 + pk('goldenFreq') + 0.10 * treeLv('gFreq');
  D.gDur = 1 + pk('goldenDur') + 0.10 * treeLv('gDur');
  D.overT = 10 + pk('overDur') + treeLv('overD');
  D.crashMul = 0.4 + 0.6 * clamp(pk('crashRed'), 0, 1);       // tap strength during Sugar Crash
  D.crashT = 8 * (1 - 0.5 * clamp(pk('crashRed'), 0, 1));
}
function milestoneCount(i) { let m = 0; MS.at.forEach(t => { if (S.up['ms_' + i + '_' + t]) m++; }); return m; }
function bldCpsEach(i) { return CFG.buildings[i].cps * Math.pow(2, milestoneCount(i)) * D.bld * D.global; }
function cpsBase() {                  // production without temporary caffeine / golden boosts
  let t = 0; for (let i = 0; i < S.b.length; i++) if (S.b[i]) t += S.b[i] * bldCpsEach(i);
  return t;
}
function caffBoost() { return R.mode === 'over' ? 1.5 : R.caff > 50 ? 1 + (R.caff - 50) / 50 * 0.5 : 1; }
function cps() { return cpsBase() * (S.buffs.prod > 0 ? 7 : 1) * caffBoost(); }
function comboMult() { return 1 + Math.min(R.combo, 150) * 0.013; }
function tapBase(c) { return D.tapPow * D.global + D.cpsTap * (c === undefined ? cps() : c); }
function tapMods() {
  let m = comboMult();
  if (R.mode === 'over') m *= 7; else if (R.mode === 'crash') m *= D.crashMul;
  if (S.buffs.tapF > 0) m *= 5;
  return m;
}

/* =====================================================================
   5. GAME LOGIC  (no DOM access here - UI talks to it through H hooks)
   ===================================================================== */
/* H = hooks the UI layer overrides. Defaults are no-ops so the engine runs headless. */
const H = {
  toast() {}, sfx() {}, buzz() {}, mode() {}, themeChanged() {}, dirty() {}
};
R.clock = 0;

function earn(n) {
  S.cans += n; S.life += n; S.run += n;
  qAdd('earn', n);
}
function markDirty(...what) { recalc(); H.dirty(what); }

/* ---------- buildings ---------- */
const BR = 1.15;
function bCost(i, n) {
  const c0 = CFG.buildings[i].cost * Math.pow(BR, S.b[i]);
  return c0 * (Math.pow(BR, n) - 1) / (BR - 1) * D.costMul;
}
function bMax(i) {
  const c1 = CFG.buildings[i].cost * Math.pow(BR, S.b[i]) * D.costMul;
  if (S.cans < c1) return 0;
  let n = Math.floor(Math.log(S.cans * (BR - 1) / c1 + 1) / Math.log(BR));
  while (n > 0 && bCost(i, n) > S.cans) n--;
  return n;
}
function buyB(i, n) {
  if (n === 'max') n = bMax(i);
  if (n < 1) return false;
  const c = bCost(i, n);
  if (S.cans < c) return false;
  S.cans -= c; S.b[i] += n;
  qAdd('buy', n, i);
  markDirty('bld', 'upg');
  return true;
}

/* ---------- upgrades (shop chains + building milestones) ---------- */
const UPGS = [];
(function buildUpgrades() {
  for (const chain in CFG.upgrades) {
    CFG.upgrades[chain].list.forEach((u, idx) => {
      UPGS.push({ id: chain + idx, name: u[0], cost: u[1],
        icon: chain === 'offline' ? '🌙' : chain === 'crate' ? '🎁' : chain === 'global' ? '🌍' : chain === 'bld' ? '🏭' : chain.startsWith('crit') ? '🎯' : '👆',
        desc: () => CFG.upgrades[chain].desc(u[2]), req: () => idx === 0 || !!S.up[chain + (idx - 1)] });
    });
  }
  CFG.buildings.forEach((b, i) => MS.at.forEach((at, j) => {
    UPGS.push({ id: 'ms_' + i + '_' + at, name: b.name + ': ' + MS.names[j], cost: b.cost * MS.costMul[j], icon: b.icon, ms: true,
      desc: () => `Own ${at} · doubles ${b.name} output`, req: () => S.b[i] >= at });
  }));
})();
function upgVisible(u) {
  return !S.up[u.id] && u.req() && u.cost <= Math.max(S.cans * 8, cpsBase() * 900);
}
function buyUpg(id) {
  const u = UPGS.find(x => x.id === id);
  if (!u || S.up[id] || !u.req() || S.cans < u.cost) return false;
  S.cans -= u.cost; S.up[id] = 1; S.st.upg++;
  markDirty('upg', 'bld'); H.sfx('buy');
  return true;
}

/* ---------- flavours, crates ---------- */
const flavAvail = f => !f.season || (f.season === 'hallo' && isHalloween());
const owned = id => !!S.fl[id];
function ownedCount() { return Object.keys(S.fl).length; }
function addCrate(kind, n = 1, quiet) {
  S.crates[kind] = (S.crates[kind] || 0) + n;
  if (!quiet) H.toast(`🎁 +${n} <b>${CFG.crates[kind].name}</b>`);
  H.dirty(['fri']);
}
function rollFlavour(kind) {
  const w = CFG.crates[kind].w;
  const entries = RAR_ORDER.map(r => {
    const pool = CFG.flavours.filter(f => f.r === r && flavAvail(f));
    let x = pool.length ? w[r] : 0;
    if (r === 'epic' || r === 'legendary') x *= D.luck;
    if (r === 'limited' && isHalloween()) x *= 2;
    return [r, x];
  });
  const r = wpick(entries);
  const pool = CFG.flavours.filter(f => f.r === r && flavAvail(f));
  const fresh = pool.filter(f => !owned(f.id));
  return (fresh.length && Math.random() < 0.7 ? pick(fresh) : pick(pool)).id;
}
/* Gives a flavour: new = unlock, duplicate = +1 level (max 10), extra copies refund cans. */
function giveFlavour(id, quiet) {
  const f = FL[id], res = { id, isNew: false, lv: 1, refund: 0 };
  if (!S.fl[id]) { S.fl[id] = { lv: 1 }; res.isNew = true; }
  else if (S.fl[id].lv < 10) S.fl[id].lv++;
  else { res.refund = Math.max(1000, cpsBase() * 300); earn(res.refund); }
  res.lv = S.fl[id].lv;
  markDirty('fri'); H.themeChanged();
  if (!quiet) H.toast(res.isNew ? `🆕 New flavour: <b>${f.name}</b>` : `⬆ <b>${f.name}</b> Lv ${res.lv}`);
  return res;
}
function openCrate(kind) {
  if (!(S.crates[kind] > 0)) return null;
  S.crates[kind]--; S.st.crates++; qAdd('crate', 1);
  const id = rollFlavour(kind), res = giveFlavour(id, true);
  res.kind = kind; H.sfx(res.isNew ? 'fanfare' : 'chime'); H.buzz([30, 40, 60]);
  return res;
}
function crateBuyCost(kind) { return Math.max(kind === 'rare' ? 12000 : 2000, cpsBase() * (kind === 'rare' ? 7200 : 1200)); }
function buyCrate(kind) {
  const c = crateBuyCost(kind);
  if (S.cans < c) return false;
  S.cans -= c; addCrate(kind, 1, true); H.sfx('buy'); return true;
}
function toggleEquip(id) {
  if (!owned(id)) return false;
  const i = S.eq.indexOf(id);
  if (i >= 0) { if (S.eq.length === 1) return false; S.eq.splice(i, 1); }
  else if (S.eq.length < slotsMax()) S.eq.push(id);
  else if (slotsMax() === 1) S.eq = [id];
  else { H.toast('All slots full - unequip one first'); return false; }
  markDirty('fri'); H.themeChanged(); H.sfx('equip');
  return true;
}
function checkMilestones() {
  CFG.flavours.forEach(f => { if (f.ms !== undefined && !owned(f.id) && S.life >= f.ms) giveFlavour(f.id); });
  while (S.life >= Math.pow(10, S.cm + 1)) {
    S.cm++; addCrate(S.cm < 7 ? 'common' : S.cm < 11 ? 'rare' : 'epic', 1);
  }
}

/* ---------- tapping, caffeine, combo ---------- */
function startOver() {
  R.mode = 'over'; R.modeT = D.overT; R.caff = 100; S.st.over++; qAdd('over', 1);
  H.mode('over'); H.sfx('over'); H.buzz([40, 30, 80]);
}
function doTap() {
  if (R.clock - R.lastTap > D.comboT) R.combo = 0;
  R.combo++; R.lastTap = R.clock;
  if (R.combo > S.st.combo) S.st.combo = R.combo;
  S.taps++; qAdd('tap', 1); qMax('combo', R.combo);
  if (R.mode === 'normal') { R.caff = Math.min(100, R.caff + 4 * D.caffG); if (R.caff >= 100) startOver(); }
  let v = tapBase() * tapMods();
  const crit = Math.random() < D.critCh;
  if (crit) { v *= D.critMul; S.st.crits++; qAdd('crit', 1); }
  earn(v);
  // rare drops: crates and straight flavour drops
  if (Math.random() < 0.0005 * D.drop) addCrate(Math.random() < 0.12 ? 'rare' : 'common', 1);
  if (Math.random() < 0.00006 * D.drop) {
    const id = rollFlavour('common'), r = giveFlavour(id, true);
    H.toast(`✨ Drop! <b>${FL[id].name}</b>${r.isNew ? ' (NEW)' : ' Lv ' + r.lv}`); H.sfx('fanfare');
  }
  return { v, crit };
}

/* ---------- golden can / limited flavour catch ---------- */
function catchGold() {
  const g = R.gold; if (!g) return null;
  R.gold = null; let msg = '';
  if (g.type === 'ltd') {
    const id = S.ev.limId;
    if (id) { giveFlavour(id, true); msg = `🎉 Caught <b>${FL[id].name}</b>!`; endLimited(true); H.sfx('fanfare'); }
  } else {
    S.st.gold++; qAdd('gold', 1);
    const k = wpick([['prod', 35], ['cash', 25], ['crate', 15], ['tapF', 25]]);
    if (k === 'prod') { S.buffs.prod = 30 * D.gDur; msg = `✨ <b>PRODUCTION FRENZY</b> ×7 for ${Math.round(30 * D.gDur)}s`; }
    else if (k === 'tapF') { S.buffs.tapF = 20 * D.gDur; msg = `👆 <b>TAP FRENZY</b> ×5 taps for ${Math.round(20 * D.gDur)}s`; }
    else if (k === 'cash') { const c = cpsBase(), a = Math.min(S.cans * 0.15, c * 900) + c * 60 + 13; earn(a); msg = `💰 <b>LUCKY!</b> +${fmt(a)} ${CFG.brand.currency}`; }
    else { const kind = wpick([['common', 70], ['rare', 25], ['epic', 5]]); addCrate(kind, 1, true); msg = `🎁 Free <b>${CFG.crates[kind].name}</b>!`; }
    H.sfx('gold');
  }
  H.toast(msg); H.buzz([20, 30, 20]); markDirty('fri');
  return msg;
}

/* ---------- events ---------- */
function startLimited() {
  const pool = CFG.flavours.filter(f => f.r === 'limited' && flavAvail(f) && !owned(f.id));
  if (!pool.length) { S.ev.nextLim = Date.now() + 12 * 3600e3; return; }
  const seasonal = pool.filter(f => f.season);
  const f = seasonal.length && Math.random() < 0.7 ? pick(seasonal) : pick(pool);
  S.ev.limId = f.id; S.ev.limEnd = Date.now() + 24 * 3600e3; R.limT = 20;
  H.toast(`⏳ <b>LIMITED DROP</b>: ${f.name} is catchable for 24h!`); H.sfx('chime');
}
function endLimited(caught) {
  S.ev.limId = null; S.ev.limEnd = 0; S.ev.nextLim = Date.now() + 12 * 3600e3;
  if (R.gold && R.gold.type === 'ltd') R.gold = null;
  if (!caught) H.toast('Limited Drop ended');
}
function eventTick(dt) {
  R.goldT -= dt;
  if (R.goldT <= 0 && !R.gold) { R.gold = { type: 'gold', t: 0 }; R.goldT = rnd(60, 180) / D.gFreq; }
  R.happyT -= dt;
  if (R.happyT <= 0) {
    R.happyT = rnd(420, 780); S.buffs.happy = 90; recalc();
    H.toast('🍻 <b>HAPPY HOUR!</b> Buildings 20% cheaper for 90s'); H.sfx('chime');
  }
  if (!S.ev.limId && S.st.time > 1500 && Date.now() >= S.ev.nextLim) startLimited();
  if (S.ev.limId) {
    if (Date.now() > S.ev.limEnd) endLimited(false);
    else { R.limT -= dt; if (R.limT <= 0 && !R.gold) { R.gold = { type: 'ltd', t: 0 }; R.limT = 90; } }
  }
}

/* ---------- quests ---------- */
function genQuests() {
  const hi = Math.max(0, ...S.b.map((n, i) => n ? i : 0));
  const c = Math.max(cpsBase(), 1);
  const pool = [
    () => ({ type: 'tap', target: pick([250, 400, 600]) }),
    () => ({ type: 'combo', target: pick([50, 75, 100]) }),
    () => ({ type: 'buy', b: clamp(hi + pick([-1, 0, 1]), 0, 11), target: pick([5, 10, 15, 20]) }),
    () => ({ type: 'gold', target: pick([1, 2]) }),
    () => ({ type: 'over', target: pick([1, 2]) }),
    () => ({ type: 'crit', target: pick([15, 25, 40]) }),
    () => ({ type: 'earn', target: Math.max(1000, Math.round(c * 1500)) }),
    () => ({ type: 'crate', target: pick([1, 2]) })
  ];
  if (S.pres.n > 0) pool.push(() => ({ type: 'mg', target: pick([1, 2]) }));
  const list = [], types = {};
  let guard = 0;
  while (list.length < 3 && guard++ < 60) {
    const q = pick(pool)();
    if (types[q.type]) continue;
    types[q.type] = 1; q.prog = 0; q.done = false; q.claimed = false; list.push(q);
  }
  list.forEach((q, i) => q.kind = i === 2 ? 'rare' : 'common');
  S.q.day = dayKey(); S.q.list = list;
}
function qDone(q) { q.done = true; H.toast('📋 Quest complete: <b>' + questText(q) + '</b>'); H.dirty(['more']); }
function qAdd(type, n, b) {
  for (const q of S.q.list) {
    if (q.type !== type || q.done || (type === 'buy' && q.b !== b)) continue;
    q.prog += n;
    if (q.prog >= q.target) { q.prog = q.target; qDone(q); }
  }
}
function qMax(type, v) {
  for (const q of S.q.list) {
    if (q.type !== type || q.done) continue;
    if (v > q.prog) q.prog = Math.min(v, q.target);
    if (q.prog >= q.target) qDone(q);
  }
}
function questText(q) { return CFG.quests[q.type](q.target, q.b); }
function questReward() { return Math.max(2000, cpsBase() * 600); }
function claimQuest(i) {
  const q = S.q.list[i]; if (!q || !q.done || q.claimed) return false;
  q.claimed = true; S.q.done++; const r = questReward(); earn(r); addCrate(q.kind, 1, true);
  H.toast(`🎁 Quest reward: <b>${fmt(r)}</b> + ${CFG.crates[q.kind].name}`); H.sfx('chime');
  markDirty('more', 'fri'); return true;
}

/* ---------- achievements (60+) ---------- */
const ACH = [];
(function buildAch() {
  const A = CFG.ach, add = (id, name, desc, icon, test) => ACH.push({ id, name, desc, icon, test });
  A.taps.forEach(([n, nm, ic]) => add('tap' + n, nm, `Tap ${fmt(n)} time${n > 1 ? 's' : ''}`, ic, () => S.taps >= n));

  A.cps.forEach(([n, nm, ic]) => add('cps' + n, nm, `Reach ${fmt(n)} ${CFG.brand.currency} per second`, ic, () => S.st.bestCps >= n));

    add('bf' + i, A.bFirst.replace('{b}', b.name), `Buy your first ${b.name}`, b.icon, () => S.b[i] >= 1);
    add('b50' + i, A.bFifty.replace('{b}', b.name), `Own 50 ${b.name}s`, b.icon, () => S.b[i] >= 50);
  });

  A.over.forEach(([n, nm, ic]) => add('over' + n, nm, `Reach ${CFG.brand.overcharge} ${n} time${n > 1 ? 's' : ''}`, ic, () => S.st.over >= n));
  A.gold.forEach(([n, nm, ic]) => add('gold' + n, nm, `Catch ${n} ${CFG.brand.golden}${n > 1 ? 's' : ''}`, ic, () => S.st.gold >= n));
  A.crit.forEach(([n, nm, ic]) => add('crit' + n, nm, `Land ${fmt(n)} critical hits`, ic, () => S.st.crits >= n));
  A.crate.forEach(([n, nm, ic]) => add('crate' + n, nm, `Open ${n} crate${n > 1 ? 's' : ''}`, ic, () => S.st.crates >= n));
  A.flav.forEach(([n, nm, ic]) => add('flav' + n, nm, `Collect ${n} flavours`, ic, () => ownedCount() >= n));
  const O = A.other;
  add('ultra', O.ultra[0], 'Collect every Ultra flavour', O.ultra[1], () => ULTRA_IDS.every(owned));
  add('legend', O.legend[0], 'Collect every Legendary flavour', O.legend[1], () => CFG.flavours.filter(f => f.r === 'legendary').every(f => owned(f.id)));
  add('all', O.all[0], 'Collect every non-seasonal flavour', O.all[1], () => CFG.flavours.filter(f => !f.season).every(f => owned(f.id)));
  add('pres1', O.pres1[0], `${CFG.brand.recycle} once`, O.pres1[1], () => S.pres.n >= 1);
  add('pres5', O.pres5[0], `${CFG.brand.recycle} 5 times`, O.pres5[1], () => S.pres.n >= 5);
  add('pres10', O.pres10[0], `${CFG.brand.recycle} 10 times`, O.pres10[1], () => S.pres.n >= 10);
  add('streak', O.streak[0], 'Reach a 7-day login streak', O.streak[1], () => S.daily.streak >= 7);
  add('mg10', O.mg10[0], 'Play 10 mini-games', O.mg10[1], () => S.st.mg >= 10);
  add('quest10', O.quest10[0], 'Complete 10 daily quests', O.quest10[1], () => S.q.done >= 10);
  add('hour1', O.hour1[0], 'Play for one hour', O.hour1[1], () => S.st.time >= 3600);
  add('lv10', O.lv10[0], 'Level a flavour to 10', O.lv10[1], () => Object.values(S.fl).some(x => x.lv >= 10));
})();
function checkAch() {
  let any = false;
  for (const a of ACH) {
    if (S.ach[a.id] || !a.test()) continue;
    S.ach[a.id] = Date.now(); any = true;
    H.toast(`${a.icon} Achievement: <b>${a.name}</b> (+1% production)`); H.sfx('chime');
    if (achCount() % 5 === 0) addCrate('common', 1);
  }
  if (any) markDirty('more', 'fri');
}

/* ---------- daily login ---------- */
function dailyInfo() {
  const today = dayKey(), y = new Date(); y.setDate(y.getDate() - 1);
  const claimed = S.daily.last === today;
  let next = claimed ? S.daily.streak : (S.daily.last === dayKey(y) ? S.daily.streak + 1 : 1);
  if (!claimed && next > 7) next = 1;
  return { claimed, next };
}
function claimDaily() {
  const d = dailyInfo(); if (d.claimed) return null;
  const r = CFG.daily[d.next - 1];
  S.daily.last = dayKey(); S.daily.streak = d.next;
  if (r.t === 'cans') earn(Math.max(1000, cpsBase() * 60 * r.m)); else addCrate(r.k, r.n, true);
  H.sfx('fanfare'); markDirty('more', 'fri'); return r;
}

/* ---------- prestige: RECYCLE ---------- */
function tokenTarget() { return Math.floor(15 * Math.pow(Math.max(S.life, 0) / 1e9, 0.55)); }
function tokenGain() { return S.run >= 1e9 ? Math.max(0, tokenTarget() - S.pres.earned) : 0; }
function canRecycle() { return tokenGain() >= 1; }
function startCans() { const l = treeLv('start'); return l ? 2500 * Math.pow(6, l - 1) : 0; }
function doRecycle() {
  if (!canRecycle()) return false;
  const g = tokenGain();
  S.pres.earned += g; S.pres.tokens += g; S.pres.n++;
  S.cans = startCans(); S.run = 0; S.b = CFG.buildings.map(() => 0); S.up = {};
  S.buffs = { prod: 0, tapF: 0, happy: 0 };
  R.caff = 0; R.mode = 'normal'; R.combo = 0; R.gold = null;
  H.mode('normal'); markDirty('bld', 'upg', 'more', 'fri'); H.sfx('fanfare');
  return g;
}
function treeNode(id) { let n = null; for (const b in CFG.tree) CFG.tree[b].nodes.forEach(x => { if (x.id === id) n = x; }); return n; }
function treeCost(node) { return Math.ceil(node.base * Math.pow(1.5, treeLv(node.id))); }
function buyTree(id) {
  const node = treeNode(id);
  if (!node || treeLv(id) >= node.max) return false;
  const c = treeCost(node); if (S.pres.tokens < c) return false;
  S.pres.tokens -= c; S.pres.tree[id] = treeLv(id) + 1; markDirty('more'); H.sfx('buy'); return true;
}

/* ---------- offline progress ---------- */
function offlineEarn(gapSec) { return cpsBase() * Math.min(gapSec, D.offCap * 3600) * D.offEff; }

/* ---------- main logic step (also used by the headless balance simulator) ---------- */
let _slow = 0;
function tick(dt) {
  R.clock += dt; S.st.time += dt;
  const c = cps(); if (c > 0) earn(c * dt);
  const cb = cpsBase(); if (cb > S.st.bestCps) S.st.bestCps = cb;
  for (const k in S.buffs) if (S.buffs[k] > 0) { S.buffs[k] -= dt; if (S.buffs[k] <= 0) { S.buffs[k] = 0; if (k === 'happy') recalc(); } }
  if (R.mode === 'over') {
    R.modeT -= dt; R.caff = Math.max(0, 100 * R.modeT / D.overT);
    if (R.modeT <= 0) { R.mode = 'crash'; R.modeT = D.crashT; R.caff = 0; H.mode('crash'); H.toast(`😵 <b>${CFG.brand.crash}</b> - taps are weaker for ${Math.round(D.crashT)}s`); }
  } else if (R.mode === 'crash') {
    R.modeT -= dt; if (R.modeT <= 0) { R.mode = 'normal'; H.mode('normal'); }
  } else if (R.caff > 0) R.caff = Math.max(0, R.caff - 10 * D.drain * dt);
  if (R.combo && R.clock - R.lastTap > D.comboT) R.combo = 0;
  eventTick(dt);
  _slow += dt;
  if (_slow >= 1) {                       // once a second: slow checks
    _slow = 0;
    checkMilestones(); checkAch();
    if (S.q.day !== dayKey()) { genQuests(); H.dirty(['more']); }
  }
}

/* =====================================================================
   6. AUDIO  -  everything is synthesised with the Web Audio API (no files)
   The AudioContext is only created on the first user interaction.
   ===================================================================== */
const AU = {
  ctx: null, master: null, nbuf: null,
  init() {
    try {
      if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
      const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
      this.ctx = new C(); this.master = this.ctx.createGain(); this.master.gain.value = 0.55; this.master.connect(this.ctx.destination);
      const n = this.ctx.sampleRate; this.nbuf = this.ctx.createBuffer(1, n, n);
      const d = this.nbuf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { this.ctx = null; }
  },
  ok() { return this.ctx && S.set.sound && this.ctx.state === 'running'; },
  noise(dur, f0, f1, vol, type = 'bandpass', q = 0.8, when = 0) {

    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t); s.stop(t + dur + 0.05);
  },
  tone(freq, dur, type = 'sine', vol = 0.12, when = 0, f1) {

    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  fizz() { this.noise(0.5, 9000, 5000, 0.1, 'highpass', 0.5); },

  fanfare() { [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => this.tone(f, 0.28, 'triangle', 0.16, i * 0.09)); this.noise(0.6, 9000, 3000, 0.12, 'highpass', 0.5, 0.1); },
  chime() { this.tone(1568, 0.5, 'sine', 0.13); this.tone(2093, 0.7, 'sine', 0.09, 0.09); },

/* =====================================================================
   7. FX  -  one canvas, capped particle count: bubbles, floating numbers, bats
   ===================================================================== */
const FX = {
  cv: null, g: null, w: 0, h: 0, dpr: 1, parts: [], texts: 0, col: [124, 255, 0],
  caps: [40, 90, 170], per: [1, 2, 4],
  init() { this.cv = $('#fx'); this.g = this.cv.getContext('2d'); this.resize(); addEventListener('resize', () => this.resize()); },
  resize() {
    const r = $('#app').getBoundingClientRect(); this.dpr = Math.min(2, window.devicePixelRatio || 1);
    this.w = r.width; this.h = r.height; this.cv.width = this.w * this.dpr; this.cv.height = this.h * this.dpr;
  },
  lvl() { return clamp(S.set.parts, 0, 2); },
  rel(e) { const r = $('#app').getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; },
  bubble(x, y, spread = 30) {
    if (this.parts.length >= this.caps[this.lvl()]) return;
    this.parts.push({ k: isHalloween() && Math.random() < 0.35 ? 'bat' : 'b', x: x + rnd(-spread, spread), y, vx: rnd(-20, 20), vy: rnd(-140, -60), r: rnd(2, 6), life: 0, max: rnd(0.8, 1.6), ph: rnd(0, 6) });
  },
  text(x, y, str, crit) {
    if (this.texts >= 14) return; this.texts++;
    this.parts.push({ k: 't', x: x + rnd(-14, 14), y, vx: rnd(-18, 18), vy: crit ? -150 : -110, s: str, crit, life: 0, max: crit ? 1.1 : 0.85 });
  },
  burst(x, y, n, col) {
    n = Math.round(n * (this.lvl() + 1) / 2);
    for (let i = 0; i < n && this.parts.length < this.caps[this.lvl()] + 40; i++) {
      const a = rnd(0, 6.283), v = rnd(60, 260);
      this.parts.push({ k: 's', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: rnd(2, 4), life: 0, max: rnd(0.4, 0.9), c: col });
    }
  },
  draw(dt) {
    const g = this.g, P = this.parts;
    if (!P.length) { if (this._clear) { g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, this.cv.width, this.cv.height); this._clear = false; } return; }
    this._clear = true;
    g.setTransform(this.dpr, 0, 0, this.dpr, 0, 0); g.clearRect(0, 0, this.w, this.h);
    const [r, gg, b] = this.col;
    for (let i = P.length - 1; i >= 0; i--) {
      const p = P[i]; p.life += dt;
      if (p.life >= p.max) { if (p.k === 't') this.texts--; P.splice(i, 1); continue; }
      const a = 1 - p.life / p.max;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.k === 'b') {
        p.x += Math.sin(p.life * 6 + p.ph) * 0.6;
        g.strokeStyle = `rgba(${r},${gg},${b},${a * 0.8})`; g.lineWidth = 1.5;
        g.beginPath(); g.arc(p.x, p.y, p.r, 0, 6.283); g.stroke();
      } else if (p.k === 's') {
        p.vy += 300 * dt; g.fillStyle = p.c || `rgb(${r},${gg},${b})`; g.globalAlpha = a;
        g.beginPath(); g.arc(p.x, p.y, p.r, 0, 6.283); g.fill(); g.globalAlpha = 1;
      } else if (p.k === 'bat') {
        const f = Math.sin(p.life * 22) * 5; g.fillStyle = `rgba(30,10,45,${a})`; g.strokeStyle = `rgba(255,122,0,${a * 0.8})`; g.lineWidth = 1;
        g.beginPath(); g.moveTo(p.x, p.y); g.quadraticCurveTo(p.x - 9, p.y - 10 - f, p.x - 15, p.y - 2);
        g.quadraticCurveTo(p.x - 9, p.y + 1, p.x - 5, p.y + 4); g.lineTo(p.x, p.y + 1); g.lineTo(p.x + 5, p.y + 4);
        g.quadraticCurveTo(p.x + 9, p.y + 1, p.x + 15, p.y - 2); g.quadraticCurveTo(p.x + 9, p.y - 10 - f, p.x, p.y); g.fill(); g.stroke();
      } else {
        g.globalAlpha = Math.min(1, a * 1.6); g.font = `${p.crit ? 38 : 26}px "Bebas Neue",Impact,sans-serif`; g.textAlign = 'center';
        g.lineWidth = 4; g.strokeStyle = 'rgba(0,0,0,.8)'; g.strokeText(p.s, p.x, p.y);
        g.fillStyle = p.crit ? '#ffd400' : '#fff'; g.fillText(p.s, p.x, p.y); g.globalAlpha = 1;
      }
    }
  }
};

let _cid = 0;
function wrapName(n) {

  if (cur) lines.push(cur); return lines.slice(0, 4);
}
function canSVG(f, o = {}) {

  }

  return `<svg viewBox="0 0 200 330" ${cls} xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="${id}b" x1="0" x2="1"><stop offset="0" stop-color="#040405"/><stop offset=".3" stop-color="#1c1c21"/><stop offset=".55" stop-color="#0e0e11"/><stop offset="1" stop-color="#030304"/></linearGradient>
<linearGradient id="${id}a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}"/><stop offset="1" stop-color="${c2}"/></linearGradient>
<linearGradient id="${id}m" x1="0" x2="1"><stop offset="0" stop-color="#7d8088"/><stop offset=".4" stop-color="#e8eaee"/><stop offset="1" stop-color="#5e6168"/></linearGradient>
<clipPath id="${id}c"><path d="${body}"/></clipPath>
</defs>
<path d="${body}" fill="url(#${id}b)" stroke="${c}" stroke-width="2" stroke-opacity=".7"/>
<g clip-path="url(#${id}c)">

<rect x="40" y="276" width="120" height="14" fill="url(#${id}a)"/>
<path d="M150 82 L96 276 L82 276 L136 82Z" fill="url(#${id}a)" opacity=".9"/>
<path d="M170 96 L112 276 L106 276 L164 96Z" fill="${c}" opacity=".75"/>
<path d="M118 82 L64 276 L56 276 L110 82Z" fill="${c}" opacity=".55"/>

<rect x="50" y="48" width="10" height="240" fill="#fff" opacity=".09"/>
${text}
</g>
<ellipse cx="100" cy="40" rx="51" ry="9" fill="url(#${id}m)"/>

<ellipse cx="100" cy="301" rx="58" ry="7" fill="url(#${id}m)" opacity=".9"/>
</svg>`;
}

/* --- 1. Shake It: DeviceMotion (iOS needs a permission tap) + tap fallback --- */
function mgShake() {
  let pressure = 0, left = 25, lastHit = 0, over = false;
  const add = n => { if (over) return; pressure = Math.min(100, pressure + n); AU.tick(); H.buzz(8); };
  let last = null;                                   // last accelerometer sample; a shake = big change on any axis
  const onMotion = e => {
    const a = e.accelerationIncludingGravity; if (!a || over) return;
    const cur = [a.x || 0, a.y || 0, a.z || 0], now = performance.now();
    if (last && Math.abs(cur[0] - last[0]) + Math.abs(cur[1] - last[1]) + Math.abs(cur[2] - last[2]) > 14 && now - lastHit > 90) { lastHit = now; add(5); }
    last = cur;
  };
  const pop = () => {
    if (over) return; over = true; removeEventListener('devicemotion', onMotion); AU.pop(); H.buzz([60, 30, 120]);
    const weak = pressure < 15;
    mgFinish('shake', 20 + pressure * 5, weak ? '⏱ TIME UP' : '💥 POP!', weak ? 'Barely any pressure built up' : `Pressure reached ${Math.round(pressure)}%`);
  };
  modal(`<h2>SHAKE IT</h2><p>Shake your phone (or mash the button) to build pressure, then POP the can before time runs out!</p>
<div class="bar pressure"><i id="mg-fill"></i></div><div class="big" id="mg-info">0%</div><div class="sm" id="mg-time">25s</div>
<div class="cb"><button class="btn alt" id="mg-shake">💥 SHAKE</button><button class="btn" id="mg-pop">POP!</button></div>
<button class="btn alt block" id="mg-motion" style="margin-top:8px">📳 Enable motion sensor</button><button class="btn alt block" data-act="close" style="margin-top:8px">QUIT</button>`,
    { sticky: true, onClose: () => { over = true; removeEventListener('devicemotion', onMotion); R.mgActive = null; } });
  $('#mg-shake').addEventListener('pointerdown', e => { e.preventDefault(); add(4); });
  $('#mg-pop').addEventListener('click', pop);
  $('#mg-motion').addEventListener('click', async () => {
    try {
      if (typeof DeviceMotionEvent !== 'undefined' && DeviceMotionEvent.requestPermission) {
        if (await DeviceMotionEvent.requestPermission() !== 'granted') return H.toast('Motion permission denied - use the button');
      }
      addEventListener('devicemotion', onMotion); $('#mg-motion').textContent = '✅ Motion sensor on - shake!';
    } catch (e) { H.toast('No motion sensor - use the button'); }
  });
  R.mgActive = { update(dt) {
    if (over) return; left -= dt; pressure = Math.max(0, pressure - 5 * dt);
    $('#mg-fill').style.width = pressure + '%'; setText($('#mg-info'), Math.round(pressure) + '%'); setText($('#mg-time'), Math.ceil(left) + 's');
    if (left <= 0) pop();
  } };
}
/* --- 2. Can Stack: timing game, height = reward --- */
function mgStack() {
  const W = 300, Hh = 420, BH = 22;
  modal(`<h2>CAN STACK</h2><p>Tap to drop the sliding cans. Overhang gets trimmed - stack as high as you can!</p>
<canvas id="mg-cv" class="mg" width="${W}" height="${Hh}" style="width:${W}px;max-width:100%"></canvas><div class="big" id="mg-info">0</div>
<div class="cb"><button class="btn" id="mg-drop">DROP</button></div><button class="btn alt block" data-act="close" style="margin-top:8px">QUIT</button>`, { sticky: true, onClose: () => { R.mgActive = null; } });
  const cv = $('#mg-cv'), g = cv.getContext('2d'), cols = CFG.flavours.map(f => f.c);
  const blocks = [{ x: 80, w: 140 }]; let cur = { x: 0, w: 140, dir: 1 }, speed = 120, perfects = 0, over = false, wait = 0;
  const drop = () => {
    if (over) return; AU.psst();
    const top = blocks[blocks.length - 1], dx = cur.x - top.x;
    if (Math.abs(dx) < 5) { cur.x = top.x; perfects++; H.buzz(15); }
    else {
      const ov = cur.w - Math.abs(dx);
      if (ov <= 4) { over = true; wait = 1.2; return; }
      cur.w = ov; if (dx < 0) cur.x = top.x;
    }
    blocks.push({ x: cur.x, w: cur.w }); speed = 120 + blocks.length * 7;
    cur = { x: cur.dir > 0 ? W - cur.w : 0, w: cur.w, dir: -cur.dir };
    setText($('#mg-info'), blocks.length - 1);
  };
  cv.addEventListener('pointerdown', e => { e.preventDefault(); drop(); });
  $('#mg-drop').addEventListener('pointerdown', e => { e.preventDefault(); drop(); });
  R.mgActive = { update(dt) {
    if (over) { wait -= dt; if (wait <= 0) { over = false; wait = 1e9; const h = blocks.length - 1; if (h > S.mg.bestStack) S.mg.bestStack = h; mgFinish('stack', 15 * h + 30 * perfects, '🧱 TOWER BUILT', `${h} can${h === 1 ? '' : 's'} high · ${perfects} perfect`); } return; }
    cur.x += cur.dir * speed * dt;
    if (cur.x <= 0) { cur.x = 0; cur.dir = 1; } else if (cur.x + cur.w >= W) { cur.x = W - cur.w; cur.dir = -1; }
    g.fillStyle = '#05050a'; g.fillRect(0, 0, W, Hh);
    const cam = Math.max(0, (blocks.length + 1) * BH - (Hh - 120)), draw = (b, i) => {
      const y = Hh - 20 - (i + 1) * BH + cam; if (y > Hh || y < -BH) return;
      g.fillStyle = cols[i % cols.length]; g.fillRect(b.x, y, b.w, BH - 2);
      g.fillStyle = 'rgba(0,0,0,.45)'; g.fillRect(b.x, y + BH - 8, b.w, 6); g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(b.x + 3, y + 2, b.w - 6, 3);
    };
    blocks.forEach((b, i) => draw(b, i)); draw(cur, blocks.length);
    g.fillStyle = '#222'; g.fillRect(0, Hh - 20 + cam, W, 20);
  } };
}
/* --- 3. Flavour Match: 30s memory game --- */
function mgMatch() {
  const fl = CFG.flavours.filter(f => !f.season).sort(() => Math.random() - 0.5).slice(0, 8);
  const cards = fl.concat(fl).sort(() => Math.random() - 0.5).map(f => ({ f, up: false, ok: false }));
  let first = -1, lock = false, left = 30, over = false, pairs = 0;
  const draw = () => {
    const gr = $('#mg-grid'); if (!gr) return;
    gr.innerHTML = cards.map((c, i) => `<button class="mcard ${c.up || c.ok ? '' : 'back'} ${c.ok ? 'ok' : ''}" data-act="mg-card" data-i="${i}">${c.up || c.ok ? canSVG(c.f, { noText: true }) : ''}</button>`).join('');
  };
  const end = () => {
    if (over) return; over = true;
    const clear = pairs === 8;
    mgFinish('match', pairs * 30 + (clear ? 60 + left * 3 : 0), clear ? '🃏 PERFECT MATCH' : '⏱ TIME UP', `${pairs}/8 pairs${clear ? ' · all cleared!' : ''}`);
  };
  modal(`<h2>FLAVOUR MATCH</h2><div class="big" id="mg-time">30</div><div class="mgrid" id="mg-grid"></div><p>Find all 8 pairs before time runs out.</p><button class="btn alt block" data-act="close" style="margin-top:8px">QUIT</button>`, { sticky: true, onClose: () => { over = true; R.mgActive = null; } });
  draw();
  ACT['mg-card'] = el => {
    const i = +el.dataset.i, c = cards[i]; if (over || lock || c.up || c.ok) return;
    c.up = true; AU.tick();
    if (first < 0) first = i;
    else {
      const a = cards[first];
      if (a.f === c.f) { a.ok = c.ok = true; a.up = c.up = false; pairs++; AU.chime(); first = -1; if (pairs === 8) { draw(); return end(); } }
      else { lock = true; first = -1; setTimeout(() => { a.up = c.up = false; lock = false; if (!over) draw(); }, 600); }
    }
    draw();
  };
  R.mgActive = { update(dt) { if (over) return; left -= dt; setText($('#mg-time'), Math.max(0, Math.ceil(left))); if (left <= 0) end(); } };
}

/* =====================================================================
   11. SAVE  -  versioned, autosave 10s + on page hide, base64 export/import
   ===================================================================== */
let _noSave = false;
function save() {
  if (_noSave) return;
  try { S.saved = Date.now(); localStorage.setItem(CFG.brand.saveKey, JSON.stringify(S)); } catch (e) {}
}
function deepMerge(t, s) {
  for (const k in s) {
    if (s[k] && typeof s[k] === 'object' && !Array.isArray(s[k]) && t[k] && typeof t[k] === 'object' && !Array.isArray(t[k])) deepMerge(t[k], s[k]);
    else t[k] = s[k];
  }
  return t;
}
/* Turns any older / partial save into the current shape. Add `if (v < N)` steps when the format changes. */
function migrate(o) {
  const n = deepMerge(newState(), o);
  // if ((o.v || 0) < 2) { ...convert v1 -> v2 here... }
  n.v = SAVE_VERSION;
  n.b = CFG.buildings.map((_, i) => Math.max(0, Math.floor(+(o.b && o.b[i]) || 0)));
  Object.keys(n.fl).forEach(id => { if (!FL[id]) delete n.fl[id]; else n.fl[id].lv = clamp(Math.floor(n.fl[id].lv) || 1, 1, 10); });
  if (!n.fl.original) n.fl.original = { lv: 1 };
  n.eq = (n.eq || []).filter((id, i, a) => n.fl[id] && a.indexOf(id) === i);
  if (!n.eq.length) n.eq = [Object.keys(n.fl)[0]];
  ['cans', 'life', 'run', 'taps'].forEach(k => { if (!isFinite(n[k]) || n[k] < 0) n[k] = 0; });
  return n;
}
function load() {
  try { const raw = localStorage.getItem(CFG.brand.saveKey); if (raw) S = migrate(JSON.parse(raw)); } catch (e) { S = newState(); }
}
const exportCode = () => btoa(unescape(encodeURIComponent(JSON.stringify(S))));
function importCode(code) {
  const o = JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
  if (!o || typeof o !== 'object' || typeof o.cans !== 'number') throw new Error('bad');
  return migrate(o);
}

/* =====================================================================
   12. PWA  -  manifest.json + PNG icons are real files; sw.js caches them for offline use
   ===================================================================== */
function setupPWA() {
  if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
}

/* =====================================================================
   13. EVENTS  -  input wiring (one delegated click handler)
   ===================================================================== */
function showOffline(gap) {
  const earned = offlineEarn(gap);
  if (earned <= 0) return maybeDaily();
  earn(earned);
  const capped = gap > D.offCap * 3600;
  modal(`<h2>WELCOME BACK!</h2><p>You were away for <b class="hl">${fmtTime(gap)}</b>${capped ? ` (capped at ${Math.round(D.offCap)}h)` : ''}. Your factories kept working at ${Math.round(D.offEff * 100)}%.</p>
<div class="big">+${fmt(earned)}</div><p>${CFG.brand.currency}</p><div class="cb"><button class="btn" data-act="close">COLLECT</button></div>`, { onClose: maybeDaily });
  AU.chime();
}
function maybeDaily() { if (!dailyInfo().claimed && $('#modal').hidden) setTimeout(() => { if ($('#modal').hidden) dailyModal(); }, 250); }

Object.assign(ACT, {
  tab: el => showTab(el.dataset.v),
  buy: el => { const n = el.dataset.n === 'max' ? 'max' : +el.dataset.n; if (buyB(+el.dataset.i, n)) { H.sfx('buy'); H.buzz(10); updBld(); } },
  upg: el => { if (buyUpg(el.dataset.id)) { H.buzz(10); renderUpg(true); updHud(); } },
  flav: el => flavModal(el.dataset.id),
  equip: el => { toggleEquip(el.dataset.id); flavModal(el.dataset.id); renderFri(); },
  'crate-open': el => crateModal(el.dataset.k),
  'crate-buy': el => { if (buyCrate(el.dataset.k)) { H.toast(`Bought a <b>${CFG.crates[el.dataset.k].name}</b>`); renderFri(); } },
  close: () => closeModal(),
  sub: el => { R.sub = el.dataset.v; renderMore(); $('#more-body').scrollTop = 0; },
  back: () => { R.sub = null; renderMore(); },
  claimq: el => { claimQuest(+el.dataset.i); renderMore(); },
  treebr: el => { R.treeBr = el.dataset.v; renderMore(); },
  tree: el => { buyTree(el.dataset.id); renderMore(); },
  recycle: () => {
    const g = tokenGain(); if (g < 1) return;
    modal(`<h2>${CFG.brand.recycle.toUpperCase()}?</h2><p>You will earn <b class="hl">+${g} ${CFG.brand.tokenShort}</b> (+${g * 2}% permanent production).</p>
<p>Resets: ${CFG.brand.currency.toLowerCase()}, buildings, upgrades.<br>Keeps: flavours, achievements, crates, ${CFG.brand.tokenShort.toLowerCase()}.</p>
<div class="cb"><button class="btn red" data-act="recycle-yes">${CFG.brand.recycle.toUpperCase()}</button><button class="btn alt" data-act="close">CANCEL</button></div>`);
  },
  'recycle-yes': () => {
    const g = doRecycle(); closeModal(); if (!g) return;
    save(); showTab('tap'); applyTheme(); UI.last.upg = ''; UI.dirty = { bld: 1, upg: 1, fri: 1, more: 1 };
    modal(`<h2>♻️ RECYCLED!</h2><div class="big">+${g}</div><p>${CFG.brand.tokens}. Spend them in the ${CFG.brand.plant} (More tab). Mini-games are now unlocked!</p><div class="cb"><button class="btn" data-act="close">LET'S GO</button></div>`);
  },
  'daily-open': () => dailyModal(),
  'daily-claim': () => { const r = claimDaily(); if (r) { dailyModal(); renderMore(); } },
  set: el => {
    const k = el.dataset.k; let v = el.dataset.v;
    if (v === 'true') v = true; else if (v === 'false') v = false; else if (k === 'parts') v = +v;
    S.set[k] = v; if (k === 'hallo') applyTheme(); if (k === 'sound' && v) { AU.init(); AU.chime(); } renderMore(); save();
  },
  export: () => {
    modal(`<h2>EXPORT SAVE</h2><p>Copy this code and paste it into IMPORT on your other device.</p><textarea id="exp" readonly>${exportCode()}</textarea>
<div class="cb"><button class="btn" data-act="copy">COPY</button><button class="btn alt" data-act="close">CLOSE</button></div>`);
  },
  copy: async () => {
    const t = $('#exp'); t.select();
    try { await navigator.clipboard.writeText(t.value); H.toast('Save code copied!'); } catch (e) { try { document.execCommand('copy'); } catch (e2) {} H.toast('Copied (or long-press to copy)'); }
  },
  import: () => {
    modal(`<h2>IMPORT SAVE</h2><p>Paste a save code. This replaces your current progress.</p><textarea id="imp" placeholder="Paste code here..."></textarea>
<div class="cb"><button class="btn red" data-act="import-do">IMPORT</button><button class="btn alt" data-act="close">CANCEL</button></div>`);
  },
  'import-do': () => {
    try { const n = importCode($('#imp').value); S = n; save(); _noSave = true; location.reload(); }
    catch (e) { H.toast('❌ That code is not a valid save'); }
  },
  reset: () => modal(`<h2>RESET GAME?</h2><p>This permanently deletes ALL progress, flavours and tokens. Export first if unsure!</p>
<div class="cb"><button class="btn red" data-act="reset-yes">DELETE EVERYTHING</button><button class="btn alt" data-act="close">CANCEL</button></div>`),
  'reset-yes': () => { _noSave = true; try { localStorage.removeItem(CFG.brand.saveKey); } catch (e) {} location.reload(); },
  mg: el => { closeModal(); startMG(el.dataset.k); }
});

function bindEvents() {
  const can = $('#can');
  can.addEventListener('pointerdown', handleTap);
  document.addEventListener('click', e => {
    AU.init();
    const t = e.target.closest('[data-act],[data-tab]');
    if (!t) { if (e.target.id === 'modal' && !$('#modal').dataset.sticky) closeModal(); return; }
    if (t.dataset.tab) return showTab(t.dataset.tab);
    const a = ACT[t.dataset.act]; if (a) a(t, e);
  });
  ['gesturestart', 'gesturechange', 'dblclick'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('textarea')) e.preventDefault(); });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { save(); R.hiddenAt = Date.now(); }
    else if (R.hiddenAt) {
      const gap = (Date.now() - R.hiddenAt) / 1000; R.hiddenAt = 0;
      if (gap > 30) { for (const k in S.buffs) S.buffs[k] = Math.max(0, S.buffs[k] - gap); recalc(); showOffline(gap); }
    }
  });
  addEventListener('pagehide', save);
}

/* =====================================================================
   14. BOOT / GAME LOOP  -  requestAnimationFrame with delta time
   ===================================================================== */
function updDots() {
  $('#dot-upg').classList.toggle('on', UPGS.some(u => upgVisible(u) && S.cans >= u.cost));
  $('#dot-fri').classList.toggle('on', (S.crates.common + S.crates.rare + S.crates.epic) > 0);
  $('#dot-more').classList.toggle('on', !dailyInfo().claimed || S.q.list.some(q => q.done && !q.claimed) || canRecycle());
}
let _last = 0, _a1 = 0, _a2 = 0, _a3 = 0, _sv = 0;
function frame(ts) {
  const dt = Math.min(0.25, Math.max(0, (ts - _last) / 1000)); _last = ts;
  tick(dt);
  if (R.mgActive) R.mgActive.update(dt);
  FX.draw(dt); uiGold(dt);
  _a1 += dt; _a2 += dt; _a3 += dt; _sv += dt;
  if (_a1 >= 0.1) { _a1 = 0; updHud(); if (R.tab === 'tap') updMeter(); }
  if (_a3 >= 0.45 && R.tab === 'tap' && FX.lvl() > 0) {          // ambient fizz from the can
    _a3 = 0; const r = $('#can').getBoundingClientRect(), a = $('#app').getBoundingClientRect();
    FX.bubble(r.left - a.left + r.width / 2, r.top - a.top + r.height * 0.9, r.width * 0.3);
  }
  if (_a2 >= 0.25) {
    _a2 = 0; updBanners(); updDots();
    const free = $('#modal').hidden;
    if (R.tab === 'bld') updBld();
    else if (R.tab === 'upg') renderUpg();
    else if (R.tab === 'fri') {
      const sig = (S.cans >= crateBuyCost('common') ? 1 : 0) + '' + (S.cans >= crateBuyCost('rare') ? 1 : 0);
      if (UI.last.fri !== sig) { UI.last.fri = sig; UI.dirty.fri = 1; }
      if (UI.dirty.fri && free) { const e = $('#fri-body'), st = e.scrollTop; renderFri(); UI.dirty.fri = 0; e.scrollTop = st; }
    } else if (R.tab === 'more') {
      const live = ['quests', 'mg', 'recycle', 'stats'].includes(R.sub), now = Math.floor(performance.now() / 1000);
      if ((UI.dirty.more || (live && UI.last.more !== now)) && free) { UI.last.more = now; UI.dirty.more = 0; renderMore(); }
    }
  }
  if (_sv >= 10) { _sv = 0; save(); }
  requestAnimationFrame(frame);
}
function boot() {
  document.title = CFG.brand.name;
  document.querySelectorAll('[data-b]').forEach(el => {
    const k = el.dataset.b; el.textContent = k === 'currency' ? CFG.brand.currency.toUpperCase() : k.startsWith('tab_') ? CFG.brand.tabs[k.slice(4)] : (CFG.brand[k] || el.textContent);
  });
  load(); recalc();
  if (S.q.day !== dayKey()) genQuests();
  FX.init(); applyTheme(); bindEvents(); setupPWA();
  if (S.ev.limId && Date.now() > S.ev.limEnd) endLimited(false);
  const gap = (Date.now() - S.saved) / 1000;
  if (S.life > 0 && gap > 60) { for (const k in S.buffs) S.buffs[k] = Math.max(0, S.buffs[k] - gap); recalc(); showOffline(gap); } else maybeDaily();
  checkMilestones(); updHud(); updMeter(); updBanners(); updDots();
  R.ready = true; requestAnimationFrame(t => { _last = t; requestAnimationFrame(frame); });
}
if (typeof window !== 'undefined' && !window.__NOBOOT) boot();
</script>
